<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disparo Porto</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="topo">
    <div class="marca">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Disparo Porto</h1>
        <p class="sub" id="subtitulo">Escolha os templates e o horário</p>
      </div>
    </div>
    <div class="segmento" id="segmento-modo" role="group" aria-label="Modo">
      <button type="button" data-modo="producao" class="ativo">Produção</button>
      <button type="button" data-modo="teste">Teste</button>
    </div>
  </header>

  <main>
    <!-- ================= MENU ================= -->
    <section id="view-menu">
      <div class="faixa vpn" id="faixa-vpn" hidden>
        <span class="ponto" aria-hidden="true"></span>
        <span id="vpn-texto"></span>
        <button type="button" class="botao-fantasma" id="btn-vpn" hidden>Verificar de novo</button>
      </div>

      <div class="faixa" id="faixa-modo"></div>

      <div class="cartao">
        <div class="cartao-topo">
          <h2>Templates</h2>
          <span class="dica">Um número por grupo</span>
        </div>
        <ul class="tipos" id="tipos"></ul>
      </div>

      <div class="cartao lancamento">
        <div class="hora-bloco">
          <div class="hora-topo">
            <label for="hora">Horário do disparo</label>
            <span class="pilula" id="hora-modo"></span>
          </div>
          <input type="time" id="hora" step="60">
        </div>
        <button type="button" class="botao-principal" id="btn-disparar">
          <span>Disparar</span>
          <small id="btn-disparar-nota"></small>
        </button>
      </div>

      <details class="cartao recolhivel">
        <summary>Opções avançadas</summary>
        <div class="conteudo">
          <label class="opcao">
            <input type="checkbox" id="gerar-base" checked>
            <span><strong>Gerar a base antes de disparar</strong><em>Desmarque para reaproveitar os CSVs que já estão na pasta</em></span>
          </label>
          <label class="opcao">
            <input type="checkbox" id="com-relatorio" checked>
            <span><strong>Gerar relatório Excel</strong><em>Planilha de conferência em relatorio/</em></span>
          </label>
          <div class="periodo">
            <label>Início <input type="date" id="data-inicio"></label>
            <label>Fim <input type="date" id="data-fim"></label>
          </div>
        </div>
      </details>

      <details class="cartao recolhivel" id="bloco-historico">
        <summary>Últimos disparos</summary>
        <div class="conteudo">
          <table class="historico">
            <thead><tr><th>Data</th><th>Hora</th><th>Base</th><th>Modo</th><th>Status</th></tr></thead>
            <tbody id="historico"></tbody>
          </table>
        </div>
      </details>
    </section>

    <!-- ================= PROGRESSO ================= -->
    <section id="view-progresso" hidden>
      <div class="cartao">
        <ol class="trilha" id="trilha">
          <li data-passo="vpn">
            <span class="bolha"></span>
            <div class="texto"><strong>Conferindo a VPN</strong><em></em></div>
          </li>
          <li data-passo="base">
            <span class="bolha"></span>
            <div class="texto"><strong>Gerando a base</strong><em></em></div>
          </li>
          <li data-passo="disparo">
            <span class="bolha"></span>
            <div class="texto">
              <strong>Disparando</strong><em></em>
              <ul class="subbases" id="subbases"></ul>
            </div>
          </li>
        </ol>
      </div>

      <div class="resultado" id="resultado" hidden></div>

      <details class="cartao recolhivel" id="bloco-log">
        <summary>Log técnico</summary>
        <div class="conteudo"><pre class="log" id="log"></pre></div>
      </details>

      <button type="button" class="botao-fantasma largo" id="btn-voltar" hidden>Voltar ao início</button>
    </section>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
